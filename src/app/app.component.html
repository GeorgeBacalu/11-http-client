<div class="container">
  <div class="row">
    <div class="col-xs-12 col-md-8 col-md-offset-3">
      <form (ngSubmit)="onCreatePost(postForm.value)" #postForm="ngForm">
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" class="form-control" name="title" ngModel required />
        </div>
        <div class="form-group">
          <label for="content">Content</label>
          <textarea id="content" class="form-control" name="content" ngModel required></textarea>
        </div>
        <button type="submit" class="btn btn-primary" [disabled]="postForm.invalid">Send Post</button>
      </form>
    </div>
  </div>
  <hr />
  <div class="row">
    <div class="col-xs-12 col-md-8 col-md-offset-3">
      <button class="btn btn-primary" (click)="onFetchPosts()">Fetch Posts</button> | 
      <button class="btn btn-danger" (click)="onClearPosts()" [disabled]="posts.length === 0">Clear Posts</button>
    </div>
  </div>
  <div class="row">
    <div class="col-xs-12 col-md-8 col-md-offset-3">
      <p *ngIf="posts.length === 0 && !isFetching">No posts available</p>
      <ul class="list-group" *ngIf="posts.length > 0 && !isFetching">
        <li class="list-group-item" *ngFor="let post of posts">
          <h3>{{ post.title }}</h3>
          <p>{{ post.content }}</p>
        </li>
      </ul>
      <p *ngIf="isFetching && !error">Loading...</p>
      <div class="alert alert-danger" *ngIf="error">
        <h3>An error occurred!</h3>
        <p>{{ error }}</p>
        <button class="btn btn-danger" (click)="onHandleError()">Okay</button>
      </div>
    </div>
  </div>
</div>
